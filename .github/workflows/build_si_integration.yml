name: Build Volla Launcher

on:
  push:
    branches:
    - si-integration
  pull_request:
    branches:
    - si-integration

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: a12e/docker-qt:5.13-android_arm64_v8a

    steps:
      - uses: actions/checkout@v1
        with:
          submodules: true

      - name: Fetch assistant
        env:
          TOKEN: ${{ secrets.ASSISTANT_REPO_TOKEN }}
          REPO: HelloVolla/volla_assistant_native
          ABI: arm64-v8a
        run: |
          sudo chown -R `id -u` ${GITHUB_WORKSPACE}
          API=https://api.github.com/repos/$REPO
          [ -n "$TOKEN" ] || { echo "ASSISTANT_REPO_TOKEN is not set for this run"; exit 1; }
          STATUS=`curl -sSL -o release.json -w '%{http_code}' -H "Authorization: token $TOKEN" $API/releases/latest`
          if [ "$STATUS" != "200" ]; then
              echo "GitHub API returned $STATUS for the latest release of $REPO:"
              cat release.json
              echo "(404: no published release, or the token cannot see the repo; 401: invalid token)"
              exit 1
          fi
          RELEASE=`tr ',' '\n' < release.json`
          TAG=`echo "$RELEASE" | grep '"tag_name"' | sed -E 's/.*"tag_name": *"([^"]+)".*/\1/'`
          ASSET=volla-assistant-native-$ABI-$TAG.tar.gz
          ASSET_URL=`echo "$RELEASE" | awk -v name="\"$ASSET\"" '/\/releases\/assets\/[0-9]+"/ { url = $0 } index($0, name) { print url; exit }' \
                     | grep -o "$API/releases/assets/[0-9]*" || true`
          [ -n "$ASSET_URL" ] || { echo "Release $TAG has no asset $ASSET"; exit 1; }
          echo "Assistant release $TAG, asset $ASSET"
          git clone --depth 1 --branch $TAG --recurse-submodules --shallow-submodules \
              https://x-access-token:$TOKEN@github.com/$REPO.git build/volla_assistant_native
          curl -fsSL -H "Authorization: token $TOKEN" -H "Accept: application/octet-stream" \
               -o build/assistant.tar.gz $ASSET_URL
          mkdir -p build/assistant-libs build/volla_assistant_native/build
          tar -xzf build/assistant.tar.gz -C build/assistant-libs
          cp build/assistant-libs/$ABI/*.so build/volla_assistant_native/build/

      - name: Build Apk
        env:
          ANDROID_KEYSTORE_FILE_CONTENTS: ${{ secrets.ANDROID_KEYSTORE_FILE_CONTENTS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          export VOLLA_ASSISTANT_ROOT=`realpath build/volla_assistant_native`
          export CACHE_DIR=build/cache
          export M2_HOME=`realpath -m $CACHE_DIR/.m2`
          export MAVEN_HOME=`realpath -m $CACHE_DIR/.m2`
          export GRADLE_USER_HOME=`realpath -m $CACHE_DIR/.gradle`
          export VERSION=`git describe --tags || git rev-parse --short HEAD`
          export TIMESTAMP=`date +%Y%m%d%H%M`
          export BUILD_ID="$VERSION-$TIMESTAMP"
          sudo chown -R `id -u` ${GITHUB_WORKSPACE}
          mkdir -p $MAVEN_HOME
          mkdir -p $GRADLE_USER_HOME
          mkdir -p releases
          ./build_package_android ./releases
          sudo chmod -R 755 ./releases