name: Build Volla Launcher

on:
  push:
    branches:
    - si-integration
  pull_request:
    branches:
    - si-integration
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASSISTANT_REPO: HelloVolla/volla_assistant_native
  ASSISTANT_ABI: arm64-v8a

jobs:
  assistant:
    runs-on: ubuntu-latest
    steps:
      - name: Find latest assistant release
        id: release
        env:
          GH_TOKEN: ${{ secrets.ASSISTANT_REPO_TOKEN || github.token }}
        run: |
          TAG=`gh release view -R $ASSISTANT_REPO --json tagName -q .tagName`
          echo "Latest assistant release: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Checkout assistant sources
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ASSISTANT_REPO }}
          ref: ${{ steps.release.outputs.tag }}
          token: ${{ secrets.ASSISTANT_REPO_TOKEN || github.token }}
          submodules: recursive
          path: volla_assistant_native

      - name: Download prebuilt libraries
        env:
          GH_TOKEN: ${{ secrets.ASSISTANT_REPO_TOKEN || github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download $TAG -R $ASSISTANT_REPO \
             -p "volla-assistant-native-$ASSISTANT_ABI-$TAG.tar.gz" -O assistant.tar.gz
          mkdir -p libs volla_assistant_native/build
          tar -xzf assistant.tar.gz -C libs
          cp libs/$ASSISTANT_ABI/*.so volla_assistant_native/build/
          ls -la volla_assistant_native/build

      - name: Package assistant
        run: |
          tar -czf assistant.tgz \
              volla_assistant_native/build \
              volla_assistant_native/assistant-core/include \
              volla_assistant_native/ai-agents/include \
              volla_assistant_native/router/include \
              volla_assistant_native/third_party/llama.cpp/include \
              volla_assistant_native/third_party/llama.cpp/ggml/include \
              volla_assistant_native/third_party/llama.cpp/vendor

      - uses: actions/upload-artifact@v4
        with:
          name: assistant
          path: assistant.tgz
          if-no-files-found: error
          retention-days: 1

  build:
    needs: assistant
    runs-on: ubuntu-latest
    container:
      image: a12e/docker-qt:5.13-android_arm64_v8a

    steps:
      - uses: actions/checkout@v1
        with:
          submodules: true

      - uses: actions/download-artifact@v4
        with:
          name: assistant

      - name: Build Apk
        env:
          ANDROID_KEYSTORE_FILE_CONTENTS: ${{ secrets.ANDROID_KEYSTORE_FILE_CONTENTS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          sudo chown -R `id -u` ${GITHUB_WORKSPACE}
          mkdir -p build/assistant
          tar -xzf assistant.tgz -C build/assistant
          export VOLLA_ASSISTANT_ROOT=`realpath build/assistant/volla_assistant_native`
          export CACHE_DIR=build/cache
          export M2_HOME=`realpath -m $CACHE_DIR/.m2`
          export MAVEN_HOME=`realpath -m $CACHE_DIR/.m2`
          export GRADLE_USER_HOME=`realpath -m $CACHE_DIR/.gradle`
          export VERSION=`git describe --tags || git rev-parse --short HEAD`
          export TIMESTAMP=`date +%Y%m%d%H%M`
          export BUILD_ID="$VERSION-$TIMESTAMP"
          mkdir -p $MAVEN_HOME
          mkdir -p $GRADLE_USER_HOME
          mkdir -p releases
          ./build_package_android ./releases
          sudo chmod -R 755 ./releases

      - uses: actions/upload-artifact@v4
        with:
          name: volla-launcher-si-integration
          path: releases/*.apk
          if-no-files-found: error
          retention-days: 14
